[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ycode"
dynamic = ["version"]
description = "YCode - a terminal-first AI coding agent powered by Claude"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0,<2",
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Train and run your own from-scratch model (ycode-lm, --local)
local = ["torch>=2.1", "numpy>=1.24"]
hub = ["huggingface_hub>=0.24"]

[project.scripts]
ycode = "ycode.cli:main"
ycode-lm = "ycode.lm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ycode.__version__" }

[tool.setuptools.packages.find]
include = ["ycode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
